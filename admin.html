<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Administration — Confirmations</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{font-family:Poppins,sans-serif;background:#0b2540;color:#e6ecf2;margin:0;padding:24px}.w{max-width:960px;margin:auto}h1{font-size:22px}h1 b{color:#7dd3fc}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,button,select{font:13px Poppins;padding:9px 12px;border-radius:10px;border:1px solid #2a3c50;background:#13273d;color:#fff}button{background:#0284c7;border:0;cursor:pointer;font-weight:600}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.k div{background:#13273d;border-radius:12px;padding:12px;font-size:12px}.k b{display:block;font-size:22px;color:#7dd3fc}table{width:100%;border-collapse:collapse;background:#13273d;border-radius:12px;overflow:hidden;font-size:13px}th,td{padding:10px;text-align:left;border-bottom:1px solid #1f344b}th{background:#0f2034;color:#9ab}#login{display:none;max-width:340px;margin:20vh auto;text-align:center}#login input{width:100%;margin:10px 0}.inviteform{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.inviteform input{flex:1;min-width:180px}.inviteform select{min-width:150px}.qrmini{width:90px;height:90px;background:#fff;padding:4px}.link{color:#7dd3fc;word-break:break-all}</style></head><body><div id="login"><h1>Espace <b>administrateur</b></h1><input id="pw" type="password" placeholder="Mot de passe"><button id="go">Entrer</button><p id="msg" style="font-size:12px;color:#ffb199"></p></div><div class="w" id="app"><h1>Confirmations de <b>présence</b></h1><h2>Créer une invitation</h2><div class="inviteform"><input id="inviteName" placeholder="Nom de l'invité"><select id="civilite"><option value="Madame">Madame</option><option value="Monsieur">Monsieur</option><option value="Couple">Couple</option></select><button id="create">Enregistrer</button></div><p id="inviteMsg"></p><div id="inviteList"></div><div class="bar"><input id="q" placeholder="Rechercher un nom…" style="flex:1"><button id="ref">Actualiser</button><button id="csv">Exporter CSV</button></div><div class="k" id="kpi"></div><table><thead><tr><th>Date</th><th>Nom</th><th>Téléphone</th><th>Table</th><th>Boissons</th></tr></thead><tbody id="tb"></tbody></table></div><script src="config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const $=s=>document.querySelector(s);let data=[],invites=[],key="";const localInv=()=>JSON.parse(localStorage.getItem("invites")||"[]");
async function load(){if(CONFIG.ENDPOINT){const r=await fetch(CONFIG.ENDPOINT+"?action=admin");const j=await r.json();if(j.error)throw "auth";data=j.rsvp||[];invites=j.invites||[]}else{if(key!=="admin")throw "auth";data=JSON.parse(localStorage.getItem("rsvp")||"[]");invites=localInv()}draw()}
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function guestUrl(i){const u=new URL("index.html",location.href);u.searchParams.set("invite",i.id);return u.href}
function draw(){let q=$("#q").value.toLowerCase(),L=data.filter(r=>(r.nom||"").toLowerCase().includes(q)),t={};data.forEach(r=>String(r.boissons||"").split(" + ").forEach(d=>{if(d)t[d]=(t[d]||0)+1}));const top=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];$("#kpi").innerHTML=`<div><b>${data.length}</b>Confirmations</div><div><b>${top?esc(top[0]):"—"}</b>Boisson n°1 (${top?top[1]:0})</div>`+Object.entries(t).map(([d,n])=>`<div><b>${n}</b>${esc(d)}</div>`).join("");$("#tb").innerHTML=L.slice().reverse().map(r=>`<tr><td>${esc(new Date(r.date).toLocaleString("fr-FR"))}</td><td>${esc(r.nom)}</td><td>${esc(r.telephone)}</td><td>${esc(r.table)}</td><td>${esc(r.boissons)}</td></tr>`).join("")||'<tr><td colspan="5">Aucune confirmation.</td></tr>';$("#inviteList").innerHTML=invites.length?'<h2>Invitations créées</h2><table><thead><tr><th>Nom</th><th>Civilité</th><th>Lien unique</th><th>QR code</th></tr></thead><tbody>'+invites.map((i,n)=>`<tr><td>${esc(i.nom)}</td><td>${esc(i.civilite)}</td><td><a class="link" href="${esc(guestUrl(i))}" target="_blank">${esc(guestUrl(i))}</a></td><td><div class="qrmini" id="mini${n}"></div></td></tr>`).join("")+'</tbody></table>':'';if(window.QRCode)invites.forEach((i,n)=>new QRCode($("#mini"+n),{text:guestUrl(i),width:82,height:82}))}
async function enter(){key=$("#pw").value;try{await load();$("#login").hidden=true;$("#app").hidden=false;draw()}catch(e){$("#msg").textContent="Connexion impossible ou mot de passe incorrect. Vérifiez config.js et CLE_ADMIN."}}
$("#go").onclick=enter;$("#pw").onkeydown=e=>{if(e.key==="Enter")enter()};$("#q").oninput=draw;$("#ref").onclick=load;
$("#create").onclick=async()=>{const nom=$("#inviteName").value.trim(),civilite=$("#civilite").value;if(!nom){$("#inviteMsg").textContent="Saisissez le nom de l'invité.";return}const i={date:new Date().toISOString(),id:crypto.randomUUID(),nom,civilite};try{if(CONFIG.ENDPOINT){await fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({type:"invite",...i})})}else{}$("#inviteName").value="";invites.push(i);if(!CONFIG.ENDPOINT)localStorage.setItem("invites",JSON.stringify(invites));$("#inviteMsg").textContent="Demande envoyée. Vérifiez la liste après actualisation.";draw()}catch(e){$("#inviteMsg").textContent="Échec de l'enregistrement. Vérifiez le déploiement du script Google."}};
$("#csv").onclick=()=>{const s="Date;Nom;Téléphone;Table;Boissons\n"+data.map(r=>[r.date,r.nom,r.telephone,r.table,r.boissons].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="confirmations.csv";a.click()};
document.addEventListener("DOMContentLoaded",()=>{$("#pw").value="admin";enter()});</script></body></html>
